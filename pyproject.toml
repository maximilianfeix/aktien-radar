[project]
name = "aktien-radar"
version = "0.1.0"
description = "Regelbasierter Signal- und Backtest-Radar fuer Aktien, ETFs und Krypto"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
