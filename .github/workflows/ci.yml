name: CI

on:
  pull_request:
    paths-ignore: ["docs/data/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
